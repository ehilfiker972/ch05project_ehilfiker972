<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validating HTML Forms with JavaScript</title>
    <link rel="stylesheet" href="styles/main.css">
    <script src="scripts/form-validation.js" defer></script>
</head>
<body>
    <header id="home">
        <h1>Validating HTML Forms with JavaScript</h1>
    </header>
    
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#Projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
    
    <main>
         <section id="contact">
            <h2>Contact Form</h2>
            <form id="contact-form" method="post" action="#">
                <label for="name">Name:</label>
                <input class="required" type="text" id="name" name="name" required>
                
                <label for="email">Email:</label>
                <input class="required" type="email" id="email" name="email" required>
                
                <label for="topic">Topic:</label>
                <select id="topic" name="topic" class="required" required>
                  <option value="">--Select a topic--</option>
                  <option value="support">Support</option>
                  <option value="review">Review</option>
                  <option value="other">Other</option>
                </select>
                <input id="submitbtn" type="button" value="Submit">
            </form>
            <span id="missing-count" aria-live="polite"></span>
         </section>
    </main>
</body>
</html>
